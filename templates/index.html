<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommender</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='select2.min.css') }}" rel="stylesheet" />
    <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='select2.min.js') }}"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212; /* Dark background for Spotify feel */
            color: #e0e0e0; /* Light text color */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 700px;
            margin: auto;
        }
        h1 {
            color: #1DB954; /* Spotify Green */
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 700;
        }
        label {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
            color: #b3b3b3;
        }
        /* Select2 Custom Styles */
        .select2-container {
            width: 100% !important; /* Ensure Select2 takes full width */
            margin-bottom: 30px; /* Increased spacing here */
        }
        .select2-selection--single {
            background-color: #282828 !important;
            border: 1px solid #535353 !important;
            border-radius: 8px !important;
            height: 48px !important; /* Slightly taller for better touch target */
            display: flex !important;
            align-items: center !important;
            padding-left: 15px !important;
            transition: all 0.2s ease-in-out;
        }
        .select2-selection--single:hover {
            border-color: #1DB954 !important; /* Highlight border on hover */
        }
        .select2-container--open .select2-selection--single {
            border-color: #1DB954 !important; /* Highlight border when open */
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.5); /* Green glow */
        }
        .select2-selection__rendered {
            color: #e0e0e0 !important;
            line-height: 48px !important; /* Center text vertically */
            padding-right: 30px !important; /* Space for arrow */
        }
        .select2-selection__arrow {
            height: 100% !important; /* Make arrow clickable area larger */
            width: 30px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            right: 0 !important;
            top: 0 !important;
        }
        .select2-selection__arrow b {
            border-color: #e0e0e0 transparent transparent transparent !important;
            border-width: 6px 5px 0 5px !important; /* Larger arrow */
            margin-top: 3px !important; /* Adjust position */
        }
        .select2-container--open .select2-selection__arrow b {
            border-color: transparent transparent #e0e0e0 transparent !important;
            margin-top: -3px !important; /* Adjust position when open */
        }
        .select2-dropdown {
            background-color: #282828 !important;
            border: 1px solid #1DB954 !important; /* Green border for dropdown */
            border-radius: 8px !important;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }
        .select2-results__option {
            color: #e0e0e0 !important;
            padding: 12px 15px !important; /* More padding for options */
            transition: background-color 0.2s ease;
        }
        .select2-results__option--highlighted {
            background-color: #1DB954 !important; /* Highlight with Spotify Green */
            color: #ffffff !important;
        }
        .select2-results__option[aria-selected="true"] {
            background-color: #3a3a3a !important; /* Selected item background */
            color: #1DB954 !important; /* Selected item text color */
        }
        .select2-search--dropdown .select2-search__field {
            background-color: #333333 !important;
            border: 1px solid #535353 !important;
            color: #e0e0e0 !important;
            border-radius: 5px !important;
            padding: 10px !important; /* More padding for search input */
            width: calc(100% - 20px) !important; /* Adjust width for padding */
            margin: 10px !important; /* Center search input */
            box-sizing: border-box;
        }
        .select2-search--dropdown .select2-search__field::placeholder {
            color: #888;
        }

        button {
            background-color: #1DB954; /* Spotify Green */
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        button:hover {
            background-color: #168a3d; /* Darker green on hover */
            transform: translateY(-2px);
        }
        .recommendations {
            margin-top: 40px;
            background-color: #282828;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            width: 100%;
        }
        .recommendations h2 {
            color: #1DB954;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .recommendations p {
            background-color: #333333;
            padding: 12px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1rem;
            color: #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recommendations p:last-child {
            margin-bottom: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            h1 {
                font-size: 1.8rem;
            }
            button {
                width: 100%;
                padding: 10px;
            }
            .select2-selection--single {
                height: 45px !important;
            }
            .select2-selection__rendered {
                line-height: 45px !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Song Recommendation System</h1>
        <form id="songForm" class="flex flex-col items-center">
            <label for="songSelect">Select a Song:</label>
            <select id="songSelect" class="select2" name="track_id" required>
                <option value="" disabled selected>Search and select a song</option>
            </select>
            <button type="submit">Get Recommendations</button>
        </form>

        <div class="recommendations" id="recommendations">
            <h2>Recommended Songs:</h2>
            <p>Select a song to see recommendations.</p>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            // Initialize Select2 for the dropdown
            $('#songSelect').select2({
                placeholder: 'Search and select a song...',
                allowClear: true
            });

            // Fetch songs from the backend and populate the dropdown
            fetch('/songs')
                .then(response => response.json())
                .then(songs => {
                    const songSelect = $('#songSelect');
                    songs.forEach(song => {
                        // Check if 'track_artist' is defined and format the option
                        const displayText = song.track_artist 
                            ? `${song.track_name} - ${song.track_artist}` 
                            : song.track_name;
                        
                        const option = new Option(displayText, song.track_id, false, false);
                        songSelect.append(option);
                    });
                    songSelect.trigger('change'); // Refresh the dropdown with new data
                })
                .catch(error => console.error('Error fetching songs:', error));
        });

        // Handle form submission to fetch recommendations
        document.getElementById('songForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const trackId = document.getElementById('songSelect').value;

            // Show loading state
            const recommendationsDiv = document.getElementById('recommendations');
            recommendationsDiv.innerHTML = '<h2>Recommended Songs:</h2><p>Loading recommendations...</p>';

            fetch('/recommend', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ track_id: trackId })
            })
            .then(response => response.json())
            .then(recommendations => {
                recommendationsDiv.innerHTML = '<h2>Recommended Songs:</h2>';
                if (recommendations.length > 0) {
                    recommendations.forEach(song => {
                        recommendationsDiv.innerHTML += `<p>${song.track_name} by ${song.track_artist}</p>`;
                    });
                } else {
                    recommendationsDiv.innerHTML += `<p>No recommendations found for this song.</p>`;
                }
            })
            .catch(error => {
                console.error('Error fetching recommendations:', error);
                recommendationsDiv.innerHTML = '<h2>Recommended Songs:</h2><p style="color: #ff6b6b;">Error loading recommendations. Please try again.</p>';
            });
        });
    </script>

</body>
</html>
